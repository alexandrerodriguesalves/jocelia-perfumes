<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f8"/>
      <stop offset="50%" stop-color="#fbe4ec"/>
      <stop offset="100%" stop-color="#e6c2cf"/>
    </linearGradient>

    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d0b197"/>
      <stop offset="10%" stop-color="#b7957b"/>
      <stop offset="100%" stop-color="#7d5e47"/>
    </linearGradient>

    <!-- Box Main Pink Color Gradient -->
    <linearGradient id="boxFrontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcdce6"/>
      <stop offset="40%" stop-color="#f8b6cc"/>
      <stop offset="100%" stop-color="#e491ad"/>
    </linearGradient>

    <linearGradient id="boxSideGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca6a89"/>
      <stop offset="100%" stop-color="#98425d"/>
    </linearGradient>

    <linearGradient id="boxTopGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffedf3"/>
      <stop offset="100%" stop-color="#f8b6cc"/>
    </linearGradient>

    <!-- Holographic Effect Gradient -->
    <linearGradient id="holographicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="25%" stop-color="#7b68ee"/>
      <stop offset="50%" stop-color="#ff1493"/>
      <stop offset="75%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#00ff7f"/>
    </linearGradient>

    <!-- Crosshatch Textured Paper Pattern -->
    <pattern id="paperTexture" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="6" y2="6" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
      <line x1="6" y1="0" x2="0" y2="6" stroke="rgba(0,0,0,0.04)" stroke-width="0.8"/>
    </pattern>

    <!-- Top Arabesque Pattern -->
    <pattern id="arabesquePattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 30,5 C 40,20 55,20 55,30 C 55,45 35,40 30,55 C 25,40 5,45 5,30 C 5,20 20,20 30,5 Z" fill="none" stroke="url(#holographicGrad)" stroke-width="1.2" opacity="0.85"/>
    </pattern>

    <!-- Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="25" dy="35"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="groundShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="30%" stop-color="rgba(55, 30, 40, 0.45)"/>
      <stop offset="70%" stop-color="rgba(55, 30, 40, 0.18)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="800" height="720" fill="url(#bgGrad)"/>

  <!-- Soft Studio Light Highlights -->
  <circle cx="210" cy="220" r="220" fill="white" opacity="0.35" filter="blur(50px)"/>
  <circle cx="640" cy="190" r="160" fill="#fbcfe8" opacity="0.4" filter="blur(45px)"/>

  <!-- Wooden Table Base -->
  <rect y="700" width="800" height="300" fill="url(#tableGrad)"/>
  <line x1="0" y1="700" x2="800" y2="700" stroke="#6e503b" stroke-width="3"/>
  <line x1="0" y1="703" x2="800" y2="703" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- Subtle Botanical Shadow (Left Side) -->
  <path d="M -40,140 Q 190,250 130,510 Q 90,370 -40,240 Z" fill="rgba(80, 40, 60, 0.06)" filter="blur(15px)"/>

  <!-- Ground Contact Shadow -->
  <ellipse cx="430" cy="730" rx="205" ry="20" fill="url(#groundShadow)"/>

  <!-- ==================== MAIN PRODUCT BOX ==================== -->
  <g filter="url(#dropShadow)">
    
    <!-- TOP FACE -->
    <polygon points="250,180 500,180 550,140 300,140" fill="url(#boxTopGrad)"/>
    <polygon points="250,180 500,180 550,140 300,140" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>

    <!-- SIDE FACE (RIGHT) -->
    <polygon points="500,180 550,140 550,670 500,710" fill="url(#boxSideGrad)"/>

    <!-- FRONT FACE BASE -->
    <polygon points="250,180 500,180 500,710 250,710" fill="url(#boxFrontGrad)"/>

    <!-- Crosshatch Paper Texture Overlay -->
    <polygon points="250,180 500,180 500,710 250,710" fill="url(#paperTexture)"/>

    <!-- Top Arabesque Pattern Overlay -->
    <rect x="250" y="180" width="250" height="130" fill="url(#arabesquePattern)"/>

    <!-- Front Border Frame Highlight -->
    <polygon points="250,180 500,180 500,710 250,710" fill="none" stroke="url(#holographicGrad)" stroke-width="2.5"/>

    <!-- ==================== FRONT FACE BRANDING & EMBLEM ==================== -->
    
    <!-- CROWN & SHIELD CREST EMBLEM (HERALDIC DESIGN) -->
    <g transform="translate(375, 340)">
      <!-- Crown Top -->
      <path d="M -15,-65 L -10,-55 L 0,-68 L 10,-55 L 15,-65 L 18,-48 L -18,-48 Z" fill="url(#holographicGrad)"/>
      
      <!-- Shield Frame -->
      <path d="M -28,-42 C -28,-42 0,-48 0,-48 C 0,-48 28,-42 28,-42 C 28,-10 20,15 0,28 C -20,15 -28,-10 -28,-42 Z" fill="none" stroke="url(#holographicGrad)" stroke-width="2.5"/>
      
      <!-- Letter 'H' in Center -->
      <text x="0" y="-8" font-family="'Playfair Display', 'Georgia', serif" font-weight="bold" font-size="30" fill="url(#holographicGrad)" text-anchor="middle">H</text>

      <!-- Laurel Leaves Frame Surrounding Shield -->
      <path d="M -36,-30 C -48,-10 -40,15 -20,32" fill="none" stroke="url(#holographicGrad)" stroke-width="2" stroke-linecap="round"/>
      <path d="M 36,-30 C 48,-10 40,15 20,32" fill="none" stroke="url(#holographicGrad)" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- BRAND NAME: wepink -->
    <text x="375" y="420" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="20" fill="url(#holographicGrad)" letter-spacing="3" text-anchor="middle">wepink</text>

    <!-- HEAVEN Pink Title -->
    <g text-anchor="middle">
      <text x="375" y="475" font-family="'Playfair Display', 'Georgia', serif" font-weight="900" font-size="38" fill="url(#holographicGrad)" letter-spacing="4">HEAVEN</text>
      <text x="375" y="520" font-family="'Brush Script MT', 'Great Vibes', 'Playfair Display', cursive" font-size="46" fill="#1b1b1b" font-style="italic">Pink</text>
    </g>

    <!-- EXTRAORDINARY COLLECTION -->
    <g text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif">
      <text x="375" y="565" font-weight="bold" font-size="13" fill="url(#holographicGrad)" letter-spacing="3">EXTRAORDINARY</text>
      <text x="375" y="582" font-weight="bold" font-size="13" fill="url(#holographicGrad)" letter-spacing="3">COLLECTION</text>
    </g>

    <!-- FRAGRANCE details -->
    <g text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif">
      <text x="375" y="620" font-size="12" font-weight="bold" fill="#333333" letter-spacing="1">FRAGRANCE <tspan fill="url(#holographicGrad)">wepink</tspan></text>
      <text x="375" y="636" font-size="10" font-weight="600" fill="#666666" letter-spacing="1">MAJESTIC FLORAL</text>
    </g>

    <!-- VOLUME (100ml | 3.38 fl. oz) -->
    <text x="470" y="688" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" fill="rgba(0,0,0,0.5)" text-anchor="end">100ml | 3.38 fl. oz</text>

    <!-- Glossy Highlight Overlay -->
    <polygon points="250,180 320,180 280,710 250,710" fill="rgba(255,255,255,0.2)"/>
  </g>

  <!-- Foreground Dried Flower Decoration (Right Side) -->
  <g opacity="0.85">
    <path d="M 685,855 Q 645,655 585,525" fill="none" stroke="#755d49" stroke-width="3"/>
    <ellipse cx="590" cy="535" rx="14" ry="24" fill="#a0856e" transform="rotate(-30 590 535)"/>
    <ellipse cx="610" cy="575" rx="16" ry="26" fill="#886c57" transform="rotate(20 610 575)"/>
    <ellipse cx="630" cy="625" rx="18" ry="28" fill="#a0856e" transform="rotate(-25 630 625)"/>
    <ellipse cx="650" cy="685" rx="20" ry="30" fill="#886c57" transform="rotate(15 650 685)"/>
  </g>

</svg>
