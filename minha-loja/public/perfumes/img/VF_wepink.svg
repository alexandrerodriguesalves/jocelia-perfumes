<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf8f5"/>
      <stop offset="50%" stop-color="#f2eae6"/>
      <stop offset="100%" stop-color="#d9cdcc"/>
    </linearGradient>

    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ccaa91"/>
      <stop offset="10%" stop-color="#b08d74"/>
      <stop offset="100%" stop-color="#7a5a43"/>
    </linearGradient>

    <!-- Box Main Dark Color Gradient -->
    <linearGradient id="boxFrontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3238"/>
      <stop offset="35%" stop-color="#212529"/>
      <stop offset="100%" stop-color="#121518"/>
    </linearGradient>

    <linearGradient id="boxSideGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121518"/>
      <stop offset="100%" stop-color="#08090a"/>
    </linearGradient>

    <linearGradient id="boxTopGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3d434a"/>
      <stop offset="100%" stop-color="#212529"/>
    </linearGradient>

    <!-- Metallic Silver Gradient -->
    <linearGradient id="silverMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6ecf2"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#9aa2a8"/>
      <stop offset="75%" stop-color="#e6ecf2"/>
      <stop offset="100%" stop-color="#6e757a"/>
    </linearGradient>

    <!-- Vertical Ribbed Texture Pattern for Box Surface -->
    <pattern id="ribbedTexture" x="0" y="0" width="4" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <line x1="2" y1="0" x2="2" y2="10" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>
    </pattern>

    <!-- Top Lace/Damask Pattern -->
    <pattern id="lacePattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0,20 Q 10,0 20,20 Q 30,40 40,20" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="20" cy="20" r="3" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>

    <!-- Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="25" dy="35"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="groundShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="30%" stop-color="rgba(15, 20, 25, 0.5)"/>
      <stop offset="70%" stop-color="rgba(15, 20, 25, 0.2)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="800" height="720" fill="url(#bgGrad)"/>

  <!-- Soft Studio Light Highlights -->
  <circle cx="220" cy="220" r="200" fill="white" opacity="0.2" filter="blur(50px)"/>
  <circle cx="620" cy="180" r="140" fill="#e2e8f0" opacity="0.3" filter="blur(40px)"/>

  <!-- Wooden Table Base -->
  <rect y="700" width="800" height="300" fill="url(#tableGrad)"/>
  <line x1="0" y1="700" x2="800" y2="700" stroke="#684a36" stroke-width="3"/>
  <line x1="0" y1="703" x2="800" y2="703" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Subtle Plant Branch Shadow (Left Side) -->
  <path d="M -40,150 Q 180,260 120,520 Q 90,380 -40,250 Z" fill="rgba(60, 50, 45, 0.07)" filter="blur(16px)"/>

  <!-- Ground Contact Shadow -->
  <ellipse cx="430" cy="730" rx="185" ry="18" fill="url(#groundShadow)"/>

  <!-- ==================== MAIN PRODUCT BOX ==================== -->
  <g filter="url(#dropShadow)">
    
    <!-- TOP FACE -->
    <polygon points="270,160 480,160 530,120 320,120" fill="url(#boxTopGrad)"/>
    <polygon points="270,160 480,160 530,120 320,120" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

    <!-- SIDE FACE (RIGHT) -->
    <polygon points="480,160 530,120 530,680 480,720" fill="url(#boxSideGrad)"/>
    <polygon points="480,160 530,120 530,680 480,720" fill="url(#ribbedTexture)" opacity="0.6"/>

    <!-- FRONT FACE BASE -->
    <polygon points="270,160 480,160 480,720 270,720" fill="url(#boxFrontGrad)"/>
    <polygon points="270,160 480,160 480,720 270,720" fill="url(#ribbedTexture)"/>

    <!-- Top Lace Decoration Overlay -->
    <rect x="270" y="160" width="210" height="110" fill="url(#lacePattern)"/>

    <!-- Front Border Accent -->
    <polygon points="270,160 480,160 480,720 270,720" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

    <!-- ==================== FRONT FACE BRANDING & TEXT ==================== -->
    
    <!-- WEPINK LOGO -->
    <text x="375" y="215" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="20" fill="url(#silverMetallic)" letter-spacing="3" text-anchor="middle">wepink</text>

    <!-- VF MONOGRAM EMBLEM -->
    <g transform="translate(375, 275)" text-anchor="middle">
      <!-- Monogram 'VF' Interlocked style -->
      <path d="M -25,-30 L -5,30 M -5,30 L 15,-30 M -20,-30 L 0,-30" fill="none" stroke="url(#silverMetallic)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M -5,-30 L -5,30 M -5,-30 L 22,-30 M -5,-2 L 15,-2" fill="none" stroke="url(#silverMetallic)" stroke-width="3" stroke-linecap="round"/>
      <!-- Outer metallic crest lines -->
      <line x1="-35" y1="0" x2="-28" y2="0" stroke="url(#silverMetallic)" stroke-width="1.5"/>
      <line x1="28" y1="0" x2="35" y2="0" stroke="url(#silverMetallic)" stroke-width="1.5"/>
    </g>

    <!-- VIRGINIA FONSECA -->
    <text x="375" y="335" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="url(#silverMetallic)" letter-spacing="3" text-anchor="middle">VIRGINIA FONSECA</text>

    <!-- Onyx (Script Effect) -->
    <text x="375" y="380" font-family="'Playfair Display', 'Georgia', 'Brush Script MT', cursive" font-size="44" fill="url(#silverMetallic)" font-style="italic" text-anchor="middle">Onyx</text>

    <!-- BODY SPLASH. -->
    <g text-anchor="middle">
      <text x="375" y="460" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="42" fill="#ffffff" letter-spacing="0.5">body</text>
      <text x="375" y="500" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="42" fill="#ffffff" letter-spacing="0.5">splash.</text>
    </g>

    <!-- STAMP / BADGE (Cuidado Essencial) -->
    <g transform="translate(305, 545)">
      <rect x="0" y="0" width="140" height="30" rx="6" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-dasharray="4,2"/>
      <text x="70" y="19" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" font-style="italic" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">cuidado essencial</text>
    </g>

    <!-- VOLUME (200ml | 6.76 fl. oz) -->
    <text x="455" y="695" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" fill="rgba(255,255,255,0.4)" text-anchor="end">200ml | 6.76 fl. oz</text>

    <!-- Glossy Highlight Overlay -->
    <polygon points="270,160 330,160 290,720 270,720" fill="rgba(255,255,255,0.05)"/>
  </g>

  <!-- Foreground Dried Flower Decoration (Right Side) -->
  <g opacity="0.8">
    <path d="M 690,860 Q 650,660 590,530" fill="none" stroke="#685243" stroke-width="3"/>
    <ellipse cx="595" cy="540" rx="14" ry="24" fill="#8c7362" transform="rotate(-30 595 540)"/>
    <ellipse cx="615" cy="580" rx="16" ry="26" fill="#755e4f" transform="rotate(20 615 580)"/>
    <ellipse cx="635" cy="630" rx="18" ry="28" fill="#8c7362" transform="rotate(-25 635 630)"/>
    <ellipse cx="655" cy="690" rx="20" ry="30" fill="#755e4f" transform="rotate(15 655 690)"/>
  </g>

</svg>
