<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="50%" stop-color="#f8f3e6"/>
      <stop offset="100%" stop-color="#e3d8c3"/>
    </linearGradient>

    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d0b197"/>
      <stop offset="10%" stop-color="#b7957b"/>
      <stop offset="100%" stop-color="#7d5e47"/>
    </linearGradient>

    <!-- Box Main Light Gold/Cream Color Gradient -->
    <linearGradient id="boxFrontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="35%" stop-color="#f9eebe"/>
      <stop offset="100%" stop-color="#e8d89a"/>
    </linearGradient>

    <linearGradient id="boxSideGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cfbe7e"/>
      <stop offset="100%" stop-color="#a19053"/>
    </linearGradient>

    <linearGradient id="boxTopGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fffbf0"/>
      <stop offset="100%" stop-color="#f9eebe"/>
    </linearGradient>

    <!-- Metallic Gold Accent Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="25%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#996515"/>
      <stop offset="75%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#7a5210"/>
    </linearGradient>

    <!-- Embossed Leaf Pattern Overlay -->
    <pattern id="embossedLeafPattern" x="0" y="0" width="80" height="120" patternUnits="userSpaceOnUse">
      <path d="M 20,10 C 40,30 60,70 20,110 C 0,70 10,30 20,10 Z" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
      <path d="M 20,10 C 40,30 60,70 20,110 C 0,70 10,30 20,10 Z" fill="none" stroke="rgba(180,150,90,0.15)" stroke-width="1.5" transform="translate(1, 1)"/>
    </pattern>

    <!-- Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="25" dy="35"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="groundShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="30%" stop-color="rgba(45, 35, 20, 0.4)"/>
      <stop offset="70%" stop-color="rgba(45, 35, 20, 0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="800" height="720" fill="url(#bgGrad)"/>

  <!-- Soft Studio Light Highlights -->
  <circle cx="200" cy="220" r="210" fill="white" opacity="0.3" filter="blur(50px)"/>
  <circle cx="650" cy="180" r="150" fill="#fef3c7" opacity="0.35" filter="blur(45px)"/>

  <!-- Wooden Table Base -->
  <rect y="700" width="800" height="300" fill="url(#tableGrad)"/>
  <line x1="0" y1="700" x2="800" y2="700" stroke="#6e503b" stroke-width="3"/>
  <line x1="0" y1="703" x2="800" y2="703" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- Subtle Botanical Shadow (Left Side) -->
  <path d="M -40,140 Q 190,250 130,510 Q 90,370 -40,240 Z" fill="rgba(80, 65, 40, 0.06)" filter="blur(15px)"/>

  <!-- Ground Contact Shadow -->
  <ellipse cx="430" cy="730" rx="185" ry="18" fill="url(#groundShadow)"/>

  <!-- ==================== MAIN PRODUCT BOX ==================== -->
  <g filter="url(#dropShadow)">
    
    <!-- TOP FACE -->
    <polygon points="270,160 480,160 530,120 320,120" fill="url(#boxTopGrad)"/>
    <polygon points="270,160 480,160 530,120 320,120" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>

    <!-- SIDE FACE (RIGHT) -->
    <polygon points="480,160 530,120 530,680 480,720" fill="url(#boxSideGrad)"/>

    <!-- FRONT FACE BASE -->
    <polygon points="270,160 480,160 480,720 270,720" fill="url(#boxFrontGrad)"/>

    <!-- Embossed Pattern Overlay -->
    <polygon points="270,160 480,160 480,720 270,720" fill="url(#embossedLeafPattern)" opacity="0.75"/>

    <!-- Front Border Frame Highlight -->
    <polygon points="270,160 480,160 480,720 270,720" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2"/>

    <!-- ==================== FRONT FACE BRANDING & EMBLEM ==================== -->
    
    <!-- ETERNAL CHERISH EMBLEM BADGE -->
    <g transform="translate(375, 320)">
      <!-- Outer Oval Frame -->
      <ellipse cx="0" cy="0" rx="65" ry="75" fill="none" stroke="#2b2316" stroke-width="2"/>
      
      <!-- Crown / Flower Icon Top -->
      <path d="M -8,-68 C -4,-74 0,-76 0,-76 C 0,-76 4,-74 8,-68 C 4,-70 0,-70 0,-70 C 0,-70 -4,-70 -8,-68 Z" fill="#2b2316"/>
      <circle cx="0" cy="-78" r="2.5" fill="#2b2316"/>

      <!-- Brand Text Inside Emblem -->
      <text x="0" y="-48" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="11" fill="#2b2316" letter-spacing="1.5" text-anchor="middle">wepink</text>

      <text x="0" y="-28" font-family="'Playfair Display', 'Georgia', serif" font-weight="bold" font-size="18" fill="#2b2316" letter-spacing="2" text-anchor="middle">ETERNAL</text>

      <text x="0" y="-12" font-family="'Playfair Display', 'Georgia', serif" font-weight="bold" font-size="16" fill="#2b2316" letter-spacing="2" text-anchor="middle">CHERISH</text>

      <!-- Infinity Floral Graphic Bottom -->
      <g stroke="#2b2316" stroke-width="1.8" fill="none">
        <!-- Infinity Loop -->
        <path d="M -35,25 C -50,10 -50,40 -35,25 C -20,10 -10,40 0,25 C 10,10 20,40 35,25 C 50,10 50,40 35,25 C 20,10 10,40 0,25 C -10,10 -20,40 -35,25 Z"/>
        <!-- Rose Detail in Center -->
        <circle cx="0" cy="18" r="5" fill="#f9eebe"/>
        <path d="M -3,18 Q 0,14 3,18 Q 0,22 -3,18"/>
      </g>
    </g>

    <!-- BODY SPLASH. -->
    <g text-anchor="middle">
      <text x="375" y="475" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="42" fill="#211c14" letter-spacing="0.5">body</text>
      <text x="375" y="515" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="42" fill="#211c14" letter-spacing="0.5">splash.</text>
    </g>

    <!-- STAMP / BADGE (Cuidado Essencial) -->
    <g transform="translate(305, 560)">
      <rect x="0" y="0" width="140" height="30" rx="6" fill="none" stroke="#211c14" stroke-width="1.5"/>
      <text x="70" y="19" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" font-style="italic" fill="#211c14" text-anchor="middle" letter-spacing="0.5">cuidado essencial</text>
    </g>

    <!-- VOLUME (200ml | 6.76 fl. oz) -->
    <text x="455" y="695" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" fill="rgba(33, 28, 20, 0.5)" text-anchor="end">200ml | 6.76 fl. oz</text>

    <!-- Glossy Highlight Overlay -->
    <polygon points="270,160 330,160 290,720 270,720" fill="rgba(255,255,255,0.2)"/>
  </g>

  <!-- Foreground Dried Flower Decoration (Right Side) -->
  <g opacity="0.85">
    <path d="M 685,855 Q 645,655 585,525" fill="none" stroke="#755d49" stroke-width="3"/>
    <ellipse cx="590" cy="535" rx="14" ry="24" fill="#a0856e" transform="rotate(-30 590 535)"/>
    <ellipse cx="610" cy="575" rx="16" ry="26" fill="#886c57" transform="rotate(20 610 575)"/>
    <ellipse cx="630" cy="625" rx="18" ry="28" fill="#a0856e" transform="rotate(-25 630 625)"/>
    <ellipse cx="650" cy="685" rx="20" ry="30" fill="#886c57" transform="rotate(15 650 685)"/>
  </g>

</svg>
